<div class="modal modal--right" id="ModalCustomized" tabindex="-1" role="dialog" aria-labelledby="ModalCustomized" aria-hidden="true" style="">
  <div class="modal-dialog" role="document">

    <app-modals-frame>

      <div header class="modal-header">
        <div class="d-flex flex-column">
          <h2>Configuración</h2>
          <p>Establezca sus preferencias</p>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div body class="modal-body">
        <div class="row">
          <div class="col-12">
            <div class="d-flex align-items-center">
              <img src="images/paint-ic.png" class="config-inside-icons"/>
              <h5 class="m-0">Elige el tema que más te guste</h5>
            </div>
            <div class="d-flex flex-row mb-2 mt-1">
              <button type="button" (click)="this.configService.changeTheme('light')" class="btn bg-theme-example__light ml-1"
              >
              </button>
              <button type="button" (click)="this.configService.changeTheme('dark')" class="btn bg-theme-example__dark ml-1"
              >
              </button>
              <button type="button" (click)="this.configService.changeTheme('dark_blue')" class="btn bg-theme-example__dark_blue ml-1"
              >
              </button>
<!--               <button type="button" (click)="this.configService.changeTheme('glass_gradient')" class="btn bg-theme-example__glass ml-1"
              >

              </button> -->
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col-12 d-flex justify-content-center">
            <img src="images/customized.svg" alt="Customized" class="img-fluid">
          </div>
        </div>
      </div>

    </app-modals-frame>

  </div>
</div>
