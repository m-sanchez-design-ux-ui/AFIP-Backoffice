<dialog id="{{ idModal }}" class="modal">
  <div class="modal-box">
    <form method="dialog">
      <button
        class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2"
        (click)="closeModal()"
      >
        ✕
      </button>
    </form>
    <h3 class="text-lg font-bold">{{ modalCancelTitle }}</h3>
    <p class="py-4">{{ modalCancelText }}</p>
    <div class="modal-action">
      <form method="dialog">
        <button class="btn" (click)="closeModal()">Close</button>
      </form>
    </div>
  </div>
</dialog>
