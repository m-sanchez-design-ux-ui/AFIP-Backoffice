<div
  id="accordion-arrow-icon"
  data-accordion="open"
  class="bg-white mt-4 rounded-lg shadow"
>
  <!-- close acordeon button -->
  <div id="accordion-arrow-icon-heading-3">
    <button
      type="button"
      class="flex items-center justify-between w-full p-5 font-medium rtl:text-right text-gray-500 gap-3 rounded-t-lg"
      data-accordion-target="#accordion-arrow-icon-body-3"
      aria-expanded="false"
      aria-controls="accordion-arrow-icon-body-3"
      [attr.aria-expanded]="isExpanded"
      [ngClass]="{
        'rounded-b-lg bg-white': !isExpanded,
        'rounded-b-none border-2 border-gray-300 bg-gray-200': isExpanded
      }"
      (click)="toggleAccordion()"
    >
      <div class="flex">
        <i-feather
          name="filter"
          class="!text-gray-800 text-lg mr-2"
        ></i-feather>
        <h4 class="ml-2.5 mb-0 !text-gray-800">Filtrar</h4>
      </div>
      <svg
        data-accordion-icon
        class="w-3 h-3 rotate-180 shrink-0 text-gray-800"
        aria-hidden="true"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 10 6"
      >
        <path
          stroke="currentColor"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M9 5 5 1 1 5"
        />
      </svg>
    </button>
  </div>

  <div
    id="accordion-arrow-icon-body-3"
    class="hidden"
    aria-labelledby="accordion-arrow-icon-heading-3"
  >
    <form [formGroup]="filterForm" (ngSubmit)="onSave()" class="p-4">
      <div class="flex flex-col gap-4 min-[860px]:flex-row">
        <div
          class="grid grid-cols-1 auto-rows-auto w-full min-[860px]:w-[calc(33.33%)]"
        >
          <div class="form-group">
            <label
              for="batch-number"
              class="block mb-2 text-sm font-semibold text-gray-800"
              >Nombre del archivo</label
            >
            <input
              type="text"
              formControlName="Name"
              name="Name"
              type="text"
              id="Name"
              class="bg-gray-50 border border-gray-300 text-gray-900 h-10 text-sm rounded-lg focus:ring-gray-900 focus:border-gray-900 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
            />
          </div>
        </div>

        <div
          class="grid grid-cols-1 auto-rows-auto w-full min-[860px]:w-[calc(66.66%)]"
        >
          <app-datepicker-es-02
            (startDateValueChange)="onStartDateValueChange($event)"
            (endDateValueChange)="onEndDateValueChange($event)"
          />
        </div>
      </div>
      <div class="flex justify-start gap-4 mt-6">
        <button
          type="button"
          class="text-gray-900 bg-white border border-gray-300 focus:outline-none hover:bg-gray-100 focus:ring-4 focus:ring-gray-100 font-medium rounded-lg text-sm px-5 py-2.5 dark:bg-gray-800 dark:text-white dark:border-gray-600 dark:hover:bg-gray-700 dark:hover:border-gray-600 dark:focus:ring-gray-700 [font-smoothing:_antialiased] [-webkit-font-smoothing:_antialiased]"
          (click)="clearFilters()"
        >
          Limpiar
        </button>

        <button
          type="submit"
          class="text-gray-900 bg-primary opacity-100 focus:outline-none hover:opacity-75 focus:ring-4 focus:ring-gray-100 font-semibold rounded-lg text-sm px-5 py-2.5 [font-smoothing:_antialiased] [-webkit-font-smoothing:_antialiased]"
        >
          Aplicar
        </button>
      </div>
    </form>
    @if (datePickerErrorMessage()) {
    <p class="pb-2 px-4 text-sm !text-red-600 dark:text-red-500">
      {{ datePickerErrorMessage() }}
    </p>
    }
  </div>
</div>
